name: Update README activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Generate README activity panel
        run: node scripts/generate-readme-activity.cjs
      - name: Commit activity panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/repo-activity.svg
          if git diff --cached --quiet; then
            echo "No activity changes."
          else
            git commit -m "Update README activity panel"
            git push
          fi
